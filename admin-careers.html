<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Forma Careers</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body { font-family: 'Plus Jakarta Sans', sans-serif; background: #0a0a0a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; }

/* Header */
.admin-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; background: #111; border-bottom: 1px solid rgba(255,255,255,0.05); }
.logo{font-size:18px;font-weight:700;color:#fff;letter-spacing:-0.5px;display:flex;align-items:center;gap:12px;text-decoration:none;}
.logo-mark{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#ff6b35,#f7c59f,#90f1ef,#7b61ff);}
.logout-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; font-weight: 600; display: none; }
.logout-btn:hover { background: rgba(255,255,255,0.1); }

/* Login View */
#login-view { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
.login-box { background: #111; padding: 40px; border-radius: 20px; width: 100%; max-width: 400px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
.login-box h2 { font-size: 24px; font-weight: 700; margin-bottom: 24px; text-align: center; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: #888; margin-bottom: 8px; }
.form-input { width: 100%; background: #050505; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px 16px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-input:focus { border-color: #7b61ff; }
.btn-primary { width: 100%; background: #fff; color: #111; border: none; padding: 14px; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s; }
.btn-primary:hover { background: #eee; }
.error-msg { color: #ff6b35; font-size: 13px; margin-top: 10px; text-align: center; display: none; }

/* Dashboard View */
#dashboard-view { display: none; flex: 1; padding: 40px; max-width: 1200px; margin: 0 auto; width: 100%; gap: 40px; }
.dash-layout { display: grid; grid-template-columns: 350px 1fr; gap: 40px; width: 100%; }

.panel { background: #111; padding: 30px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); }
.panel h3 { font-size: 18px; font-weight: 700; margin-bottom: 24px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }

/* Job Form */
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
textarea.form-input { resize: vertical; min-height: 120px; }

/* Jobs List */
.jobs-list { display: flex; flex-direction: column; gap: 15px; }
.job-item { background: #050505; border: 1px solid rgba(255,255,255,0.05); padding: 20px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
.job-item-info h4 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
.job-item-meta { font-size: 13px; color: #888; display: flex; gap: 12px; }
.btn-danger { background: rgba(255,107,53,0.1); color: #ff6b35; border: 1px solid rgba(255,107,53,0.2); padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-danger:hover { background: #ff6b35; color: #fff; }

.mock-alert { background: rgba(123,97,255,0.1); border: 1px solid rgba(123,97,255,0.3); color: #a78bfa; padding: 15px; border-radius: 8px; font-size: 13px; margin-bottom: 20px; text-align: center; }

@media (max-width: 900px) {
  .dash-layout { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header class="admin-header">
  <div class="logo"><div class="logo-mark"></div>Forma Admin</div>
  <button class="logout-btn" id="logoutBtn">Logout</button>
</header>

<div id="login-view">
  <div class="login-box">
    <h2>Admin Login</h2>
    <div id="mockAlertLogin" class="mock-alert" style="display:none;">
      Firebase not configured. Click Login to view the dashboard in Mock Mode.
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-input" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-input" required>
      </div>
      <button type="submit" class="btn-primary">Login</button>
      <div class="error-msg" id="loginError">Invalid credentials.</div>
    </form>
  </div>
</div>

<div id="dashboard-view">
  <div class="dash-layout">
    <!-- Add Job Panel -->
    <div class="panel">
      <h3>Create New Listing</h3>
      <form id="addJobForm">
        <div class="form-group">
          <label>Job Title</label>
          <input type="text" id="jTitle" class="form-input" required placeholder="e.g. Senior Product Designer">
        </div>
        <div class="row">
          <div class="form-group">
            <label>Type</label>
            <select id="jType" class="form-input" required>
              <option value="Full-time">Full-time</option>
              <option value="Part-time">Part-time</option>
              <option value="Contract">Contract</option>
              <option value="Internship">Internship</option>
            </select>
          </div>
          <div class="form-group">
            <label>Department</label>
            <input type="text" id="jDept" class="form-input" required placeholder="e.g. Design">
          </div>
        </div>
        <div class="form-group">
          <label>Location</label>
          <input type="text" id="jLoc" class="form-input" required placeholder="e.g. Remote / NYC">
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="jDesc" class="form-input" required placeholder="Brief description of the role..."></textarea>
        </div>
        <button type="submit" class="btn-primary" id="addBtn">Post Job</button>
      </form>
    </div>

    <!-- Active Jobs Panel -->
    <div class="panel">
      <h3>Active Listings</h3>
      <div id="mockAlertDash" class="mock-alert" style="display:none;">
        Running in Mock Mode. Changes will not be saved to the database. Add your API keys to js/firebase-config.js.
      </div>
      <div class="jobs-list" id="jobsList">
        <!-- Rendered via JS -->
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { fetchJobs, addJob, deleteJob, loginAdmin, logoutAdmin, listenAuthState } from './js/firebase-config.js';

  // State
  let isMockMode = false;
  let currentJobs = [];

  // DOM Elements
  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const logoutBtn = document.getElementById('logoutBtn');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const addJobForm = document.getElementById('addJobForm');
  const jobsList = document.getElementById('jobsList');
  const mockAlertLogin = document.getElementById('mockAlertLogin');
  const mockAlertDash = document.getElementById('mockAlertDash');

  // Check if Firebase is configured by testing fetchJobs without Auth
  async function checkFirebaseStatus() {
    try {
      const test = await fetchJobs();
      if (test && test[0] && test[0].id && test[0].id.startsWith('mock')) {
        isMockMode = true;
        mockAlertLogin.style.display = 'block';
      }
    } catch(e) {
      // If permission denied, it means Firebase IS configured but protected. Not mock.
      if(e.code !== 'permission-denied') {
        isMockMode = true;
        mockAlertLogin.style.display = 'block';
      }
    }
  }
  checkFirebaseStatus();

  // Auth Listener
  listenAuthState((user) => {
    if (user || isMockMode) {
      // Logged in
      loginView.style.display = 'none';
      dashboardView.style.display = 'flex';
      logoutBtn.style.display = 'block';
      if(isMockMode) mockAlertDash.style.display = 'block';
      loadJobs();
    } else {
      // Logged out
      loginView.style.display = 'flex';
      dashboardView.style.display = 'none';
      logoutBtn.style.display = 'none';
    }
  });

  // Login Form
  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.style.display = 'none';
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (isMockMode) {
      // Fake login for UI testing
      loginView.style.display = 'none';
      dashboardView.style.display = 'flex';
      logoutBtn.style.display = 'block';
      mockAlertDash.style.display = 'block';
      loadJobs();
    } else {
      try {
        await loginAdmin(email, password);
      } catch (error) {
        loginError.style.display = 'block';
        loginError.textContent = error.message;
      }
    }
  });

  // Logout
  logoutBtn.addEventListener('click', () => {
    if (isMockMode) {
      location.reload(); // Quick reset for mock mode
    } else {
      logoutAdmin();
    }
  });

  // Load Jobs into Dashboard
  async function loadJobs() {
    jobsList.innerHTML = '<div style="color:#888;">Loading...</div>';
    try {
      currentJobs = await fetchJobs();
      renderJobs();
    } catch (error) {
      jobsList.innerHTML = `<div style="color:#ff6b35;">Failed to load jobs: ${error.message}</div>`;
    }
  }

  function renderJobs() {
    if (currentJobs.length === 0) {
      jobsList.innerHTML = '<div style="color:#888; text-align:center; padding: 20px;">No active listings.</div>';
      return;
    }

    jobsList.innerHTML = '';
    currentJobs.forEach(job => {
      const el = document.createElement('div');
      el.className = 'job-item';
      el.innerHTML = `
        <div class="job-item-info">
          <h4>${job.title}</h4>
          <div class="job-item-meta">
            <span>${job.department}</span> • <span>${job.type}</span> • <span>${job.location}</span>
          </div>
        </div>
        <button class="btn-danger" data-id="${job.id}">Delete</button>
      `;
      jobsList.appendChild(el);
    });

    // Attach delete listeners
    document.querySelectorAll('.btn-danger').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        const id = e.target.getAttribute('data-id');
        if (confirm("Are you sure you want to delete this listing?")) {
          e.target.textContent = 'Deleting...';
          if (isMockMode) {
            currentJobs = currentJobs.filter(j => j.id !== id);
            renderJobs();
          } else {
            try {
              await deleteJob(id);
              loadJobs();
            } catch(err) {
              alert("Error deleting job: " + err.message);
              e.target.textContent = 'Delete';
            }
          }
        }
      });
    });
  }

  // Add Job
  addJobForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('addBtn');
    btn.textContent = 'Posting...';
    btn.disabled = true;

    const newJob = {
      title: document.getElementById('jTitle').value,
      type: document.getElementById('jType').value,
      department: document.getElementById('jDept').value,
      location: document.getElementById('jLoc').value,
      description: document.getElementById('jDesc').value
    };

    if (isMockMode) {
      setTimeout(() => {
        currentJobs.unshift({ id: 'mock_new_' + Date.now(), ...newJob });
        renderJobs();
        addJobForm.reset();
        btn.textContent = 'Post Job';
        btn.disabled = false;
      }, 500);
    } else {
      try {
        await addJob(newJob);
        addJobForm.reset();
        await loadJobs();
      } catch (err) {
        alert("Error adding job: " + err.message);
      } finally {
        btn.textContent = 'Post Job';
        btn.disabled = false;
      }
    }
  });

</script>
</body>
</html>
