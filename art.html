<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y-List — Art</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #181818;
    --bg4: #1e1e1e;
    --text: #f5f2eb;
    --text-muted: #8a8680;
    --text-dim: #555250;
    --accent: #e8d5a3;
    --accent2: #c4a882;
    --border: #1e1e1e;
    --border2: #2a2a28;
    --ongoing: #4caf74;
    --upcoming: #5b9bd5;
    --over: #555250;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* NAV */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 0;
    max-width: 720px;
    margin: 0 auto;
  }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.3px;
    color: var(--text);
    text-decoration: none;
  }

  .nav-links { display: flex; gap: 4px; }

  .nav-link {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    color: var(--text-muted);
    transition: all 0.18s;
  }

  .nav-link:hover { color: var(--text); }

  .nav-link.active {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border2);
  }

  /* HERO */
  .hero {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(32px, 8vw, 48px);
    line-height: 1.05;
    letter-spacing: -1px;
  }

  .hero h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
  }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 16px;
    padding: 10px 20px 0;
    max-width: 720px;
    margin: 0 auto;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.02em;
  }

  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .legend-dot.ongoing { background: var(--ongoing); }
  .legend-dot.upcoming { background: var(--upcoming); }
  .legend-dot.over { background: var(--over); }

  /* CITY FILTER */
  .city-tabs {
    display: flex;
    gap: 6px;
    padding: 16px 20px 0;
    max-width: 720px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }

  .city-tabs::-webkit-scrollbar { display: none; }

  .city-tab {
    flex-shrink: 0;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.16s;
    white-space: nowrap;
  }

  .city-tab:hover { color: var(--text); border-color: #444; }

  .city-tab.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* STATUS FILTER */
  .status-tabs {
    display: flex;
    gap: 6px;
    padding: 10px 20px 0;
    max-width: 720px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .status-tabs::-webkit-scrollbar { display: none; }

  .status-tab {
    flex-shrink: 0;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.16s;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }

  .status-tab:hover { color: var(--text); }

  .status-tab.active-ongoing { background: rgba(76,175,116,0.15); border-color: var(--ongoing); color: var(--ongoing); }
  .status-tab.active-upcoming { background: rgba(91,155,213,0.15); border-color: var(--upcoming); color: var(--upcoming); }
  .status-tab.active-over { background: var(--bg3); border-color: #444; color: var(--text-muted); }
  .status-tab.active-all { background: var(--text); border-color: var(--text); color: var(--bg); }

  /* SEARCH */
  .search-wrap {
    position: relative;
    padding: 12px 20px 0;
    max-width: 720px;
    margin: 0 auto;
  }

  .search-icon {
    position: absolute;
    left: 34px;
    top: 50%;
    transform: translateY(-8px);
    color: var(--text-dim);
    pointer-events: none;
    font-size: 14px;
  }

  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 10px 16px 10px 40px;
    outline: none;
    transition: border-color 0.18s;
  }

  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--accent2); }

  /* MAIN CONTENT */
  .main {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }

  /* VIEW TOGGLE */
  .view-toggle {
    display: flex;
    gap: 4px;
    align-items: center;
    margin-bottom: 16px;
    justify-content: flex-end;
  }

  .view-btn {
    padding: 5px 12px;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-dim);
    font-size: 12px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
    font-weight: 500;
  }

  .view-btn:hover { color: var(--text); }
  .view-btn.active { background: var(--bg3); color: var(--text); border-color: #444; }

  /* ── MUSEUM VIEW ── */
  .museum-section {
    margin-bottom: 28px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    background: var(--bg2);
  }

  .museum-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--bg3);
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }

  .museum-header:hover { background: var(--bg4); }

  .museum-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.1px;
  }

  .museum-city {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 400;
  }

  .museum-counts {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-shrink: 0;
  }

  .count-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 10px;
    white-space: nowrap;
  }

  .count-badge.ongoing { background: rgba(76,175,116,0.15); color: var(--ongoing); }
  .count-badge.upcoming { background: rgba(91,155,213,0.15); color: var(--upcoming); }

  .museum-toggle-icon {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 8px;
    transition: transform 0.2s;
  }

  .museum-toggle-icon.open { transform: rotate(90deg); }

  /* Exhibition grid inside museum */
  .museum-exhs {
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  @media (max-width: 400px) {
    .museum-exhs { grid-template-columns: 1fr; }
  }

  .exh-card {
    background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 10px;
    overflow: hidden;
    cursor: pointer;
    transition: all 0.16s;
    text-decoration: none;
    display: block;
  }

  .exh-card:hover { border-color: #3a3a38; transform: translateY(-1px); }

  .exh-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: var(--bg3);
    display: block;
  }

  .exh-img-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    color: var(--text-dim);
  }

  .exh-body { padding: 10px 12px; }

  .exh-status-dot {
    display: inline-block;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    margin-right: 5px;
    vertical-align: middle;
  }

  .exh-status-dot.ongoing { background: var(--ongoing); }
  .exh-status-dot.upcoming { background: var(--upcoming); }
  .exh-status-dot.over { background: var(--over); }

  .exh-status-text {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-dim);
    vertical-align: middle;
  }

  .exh-status-text.ongoing { color: var(--ongoing); }
  .exh-status-text.upcoming { color: var(--upcoming); }

  .exh-name {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    margin-top: 5px;
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── CARD GRID VIEW ── */
  .cards-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (max-width: 400px) {
    .cards-grid { grid-template-columns: 1fr; }
  }

  .big-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: pointer;
    transition: all 0.16s;
    text-decoration: none;
    display: block;
  }

  .big-card:hover { border-color: var(--border2); transform: translateY(-2px); }

  .big-card-img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    background: var(--bg3);
    display: block;
  }

  .big-card-placeholder {
    width: 100%;
    aspect-ratio: 4/3;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    color: var(--text-dim);
  }

  .big-card-body { padding: 12px 14px 14px; }

  .big-card-status {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-bottom: 6px;
  }

  .big-card-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .big-card-dot.ongoing { background: var(--ongoing); }
  .big-card-dot.upcoming { background: var(--upcoming); }
  .big-card-dot.over { background: var(--over); }

  .big-card-status-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
  }

  .big-card-status-label.ongoing { color: var(--ongoing); }
  .big-card-status-label.upcoming { color: var(--upcoming); }
  .big-card-status-label.over { color: var(--over); }

  .big-card-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.35;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .big-card-museum {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* skeleton */
  .skeleton-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    animation: shimmer 1.4s infinite;
  }

  .skeleton-card-img { width: 100%; aspect-ratio: 4/3; background: var(--bg3); }
  .skeleton-card-body { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .skeleton-line { border-radius: 4px; background: var(--bg3); height: 10px; }
  .skeleton-line.w80 { width: 80%; }
  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w40 { width: 40%; }

  @keyframes shimmer {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  .no-results {
    padding: 40px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  .result-count {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 14px;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    overflow-y: auto;
    padding: 20px;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

  .modal {
    background: var(--bg2);
    border: 1px solid var(--border2);
    border-radius: 16px;
    width: 100%;
    max-width: 500px;
    overflow: hidden;
    margin: auto;
  }

  .modal-img {
    width: 100%;
    aspect-ratio: 16/9;
    object-fit: cover;
    background: var(--bg3);
    display: block;
  }

  .modal-img-placeholder {
    width: 100%;
    aspect-ratio: 16/9;
    background: var(--bg3);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    color: var(--text-dim);
  }

  .modal-body { padding: 20px 24px 28px; }

  .modal-status {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 12px;
  }

  .modal-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .modal-dot.ongoing { background: var(--ongoing); }
  .modal-dot.upcoming { background: var(--upcoming); }
  .modal-dot.over { background: var(--over); }

  .modal-status-text {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .modal-status-text.ongoing { color: var(--ongoing); }
  .modal-status-text.upcoming { color: var(--upcoming); }
  .modal-status-text.over { color: var(--over); }

  .modal-title {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    line-height: 1.2;
    color: var(--text);
    margin-bottom: 8px;
    letter-spacing: -0.3px;
  }

  .modal-museum {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .modal-city {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 20px;
  }

  .modal-notes {
    font-size: 13px;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.5;
    margin-bottom: 20px;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .modal-btn {
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 500;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.15s;
    border: 1px solid var(--border2);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  .modal-btn-primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .modal-btn-primary:hover { background: var(--accent); border-color: var(--accent); }

  .modal-btn-secondary {
    background: transparent;
    color: var(--text-muted);
  }

  .modal-btn-secondary:hover { color: var(--text); border-color: #444; }

  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: none;
    color: white;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
    z-index: 10;
  }

  .modal-inner { position: relative; }

  /* Museum detail panel */
  .museum-detail {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 900;
    overflow-y: auto;
  }

  .museum-detail.open { display: block; }

  .museum-detail-header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    max-width: 720px;
    margin: 0 auto;
  }

  .back-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    cursor: pointer;
    padding: 0;
    line-height: 1;
    transition: color 0.15s;
  }

  .back-btn:hover { color: var(--text); }

  .museum-detail-name {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--text);
    letter-spacing: -0.3px;
  }

  .museum-detail-body {
    max-width: 720px;
    margin: 0 auto;
    padding: 16px 20px 60px;
  }

  .detail-section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 16px 0 10px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }

</style>
</head>
<body>

<div style="max-width:720px;margin:0 auto">
  <nav class="nav">
    <a href="#" class="nav-logo">Y‑List</a>
    <div class="nav-links">
      <a href="eat.html" class="nav-link">Eat</a>
      <a href="art.html" class="nav-link active">Art</a>
    </div>
  </nav>

  <div class="hero">
    <h1>What's <em>on.</em></h1>
    <div class="hero-meta" id="heroMeta">Loading exhibitions…</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><span class="legend-dot ongoing"></span>Ongoing</div>
  <div class="legend-item"><span class="legend-dot upcoming"></span>Upcoming</div>
  <div class="legend-item"><span class="legend-dot over"></span>Past</div>
</div>

<div class="city-tabs" id="cityTabs"></div>
<div class="status-tabs" id="statusTabs"></div>

<div class="search-wrap">
  <span class="search-icon">⌕</span>
  <input class="search-input" type="text" id="searchInput" placeholder="Search exhibitions…" autocomplete="off" autocorrect="off" spellcheck="false">
</div>

<div class="main">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div class="result-count" id="resultCount"></div>
    <div class="view-toggle">
      <button class="view-btn" id="btnMuseum">By Museum</button>
      <button class="view-btn active" id="btnGrid">Grid</button>
    </div>
  </div>
  <div id="contentEl"></div>
</div>

<!-- Exhibition Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-inner">
      <button class="modal-close" id="modalClose">✕</button>
      <div id="modalImgWrap"></div>
      <div class="modal-body">
        <div class="modal-status"><span class="modal-dot" id="modalDot"></span><span class="modal-status-text" id="modalStatusText"></span></div>
        <div class="modal-title" id="modalTitle"></div>
        <div class="modal-museum" id="modalMuseum"></div>
        <div class="modal-city" id="modalCity"></div>
        <div class="modal-notes" id="modalNotes" style="display:none"></div>
        <div class="modal-actions" id="modalActions"></div>
      </div>
    </div>
  </div>
</div>

<!-- Museum Detail Panel -->
<div class="museum-detail" id="museumDetail">
  <div class="museum-detail-header">
    <button class="back-btn" id="detailBack">←</button>
    <div>
      <div class="museum-detail-name" id="detailName"></div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:2px" id="detailCity"></div>
    </div>
  </div>
  <div class="museum-detail-body" id="detailBody"></div>
</div>

<script>
const API = 'https://ylist-api.ymanoukian.workers.dev/api/art';

let allRecords = [];
let activeCity = 'All';
let activeStatus = 'All';
let searchQuery = '';
let viewMode = 'grid'; // 'grid' | 'museum'

function showSkeleton() {
  const el = document.getElementById('contentEl');
  el.innerHTML = `<div class="cards-grid">${Array(6).fill(0).map(() => `
    <div class="skeleton-card">
      <div class="skeleton-card-img"></div>
      <div class="skeleton-card-body">
        <div class="skeleton-line w40"></div>
        <div class="skeleton-line w80"></div>
        <div class="skeleton-line w60"></div>
      </div>
    </div>
  `).join('')}</div>`;
}

function buildCityTabs(records) {
  const cities = ['All', ...new Set(records.map(r => r.city).filter(Boolean)).values()].sort((a,b) => a === 'All' ? -1 : 0);
  const el = document.getElementById('cityTabs');
  el.innerHTML = cities.map(c => `<button class="city-tab${c === activeCity ? ' active' : ''}" data-city="${c}">${c}</button>`).join('');
  el.querySelectorAll('.city-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCity = btn.dataset.city;
      el.querySelectorAll('.city-tab').forEach(b => b.classList.toggle('active', b.dataset.city === activeCity));
      render();
    });
  });
}

function buildStatusTabs() {
  const statuses = ['All', 'Ongoing', 'Upcoming', 'Over'];
  const el = document.getElementById('statusTabs');
  el.innerHTML = statuses.map(s => {
    const cls = s === activeStatus ? `active-${s.toLowerCase()}` : '';
    const dot = s !== 'All' ? `<span style="width:6px;height:6px;border-radius:50%;background:var(--${s.toLowerCase()});flex-shrink:0;display:inline-block"></span>` : '';
    return `<button class="status-tab ${cls}" data-status="${s}">${dot}${s}</button>`;
  }).join('');
  el.querySelectorAll('.status-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeStatus = btn.dataset.status;
      el.querySelectorAll('.status-tab').forEach(b => {
        const s = b.dataset.status;
        b.className = `status-tab${s === activeStatus ? ` active-${s.toLowerCase()}` : ''}`;
      });
      render();
    });
  });
}

function filterRecords() {
  const q = searchQuery.toLowerCase().trim();
  return allRecords.filter(r => {
    if (activeCity !== 'All' && r.city !== activeCity) return false;
    if (activeStatus !== 'All' && r.status !== activeStatus) return false;
    if (q && !(r.name||'').toLowerCase().includes(q) && !(r.museum||'').toLowerCase().includes(q) && !(r.city||'').toLowerCase().includes(q)) return false;
    return true;
  });
}

function getMuseumKey(r) {
  // Use museum field or derive from city + image domain as fallback
  if (r.museum) return r.museum;
  // Try to guess museum from image URL
  const url = r.image || '';
  if (url.includes('brooklynmuseum')) return 'Brooklyn Museum';
  if (url.includes('moma.org')) return 'MoMA';
  if (url.includes('metmuseum') || url.includes('sanity.io/images/cctd4ker')) return 'The Met';
  if (url.includes('guggenheim')) return 'Guggenheim';
  if (url.includes('whitneymedia')) return 'Whitney Museum';
  if (url.includes('mcny.org')) return 'Museum of the City of NY';
  if (url.includes('frick.org')) return 'Frick Collection';
  if (url.includes('studiomuseum')) return 'Studio Museum in Harlem';
  if (url.includes('queensmuseum')) return 'Queens Museum';
  if (url.includes('tate.org')) return 'Tate Modern';
  if (url.includes('nationalgallery')) return 'National Gallery';
  if (url.includes('royalacademy')) return 'Royal Academy';
  if (url.includes('vam.ac.uk')) return 'V&A';
  if (url.includes('wallacecollection')) return 'Wallace Collection';
  if (url.includes('southbankcentre')) return 'Southbank Centre';
  if (url.includes('soane.org')) return "Sir John Soane's Museum";
  if (url.includes('centrepompidou')) return 'Centre Pompidou';
  if (url.includes('quaibranly')) return 'Musée du Quai Branly';
  if (url.includes('louvre')) return 'Louvre';
  if (url.includes('carnavalet')) return 'Musée Carnavalet';
  if (url.includes('petitpalais')) return 'Petit Palais';
  if (url.includes('marmottan')) return 'Musée Marmottan';
  if (url.includes('musee-jacquemart')) return 'Musée Jacquemart-André';
  if (url.includes('museepicassoparis')) return 'Musée Picasso';
  if (url.includes('musee-moyenage')) return 'Musée de Cluny';
  if (url.includes('d37zoqglehb9o7')) return 'Hayward Gallery';
  if (url.includes('bynder.southbank')) return 'Southbank Centre';
  return r.city ? `${r.city} — Other` : 'Other';
}

function statusClass(s) {
  if (!s) return 'over';
  return s.toLowerCase();
}

function renderExhCard(r, small = false) {
  const museum = getMuseumKey(r);
  const sc = statusClass(r.status);
  const imgEl = r.image
    ? `<img class="${small ? 'exh-img' : 'big-card-img'}" src="${r.image}" alt="" loading="lazy" onerror="this.style.display='none'">`
    : `<div class="${small ? 'exh-img-placeholder' : 'big-card-placeholder'}">🖼</div>`;

  if (small) {
    return `
      <div class="exh-card" onclick="openModal('${escApos(r.id)}')">
        ${imgEl}
        <div class="exh-body">
          <span class="exh-status-dot ${sc}"></span><span class="exh-status-text ${sc}">${r.status || 'Past'}</span>
          <div class="exh-name">${escHtml(r.name || '')}</div>
        </div>
      </div>
    `;
  }

  return `
    <div class="big-card" onclick="openModal('${escApos(r.id)}')">
      ${imgEl}
      <div class="big-card-body">
        <div class="big-card-status">
          <span class="big-card-dot ${sc}"></span>
          <span class="big-card-status-label ${sc}">${r.status || 'Past'}</span>
        </div>
        <div class="big-card-name">${escHtml(r.name || '')}</div>
        <div class="big-card-museum">${escHtml(museum)}</div>
      </div>
    </div>
  `;
}

function render() {
  const records = filterRecords();
  document.getElementById('resultCount').textContent = `${records.length} exhibition${records.length !== 1 ? 's' : ''}`;

  const el = document.getElementById('contentEl');

  if (records.length === 0) {
    el.innerHTML = `<div class="no-results">No exhibitions found.<br><span style="font-size:11px;margin-top:4px;display:block">Try adjusting your filters.</span></div>`;
    return;
  }

  if (viewMode === 'grid') {
    el.innerHTML = `<div class="cards-grid">${records.map(r => renderExhCard(r, false)).join('')}</div>`;
  } else {
    // Museum view: group by museum
    const groups = {};
    records.forEach(r => {
      const m = getMuseumKey(r);
      if (!groups[m]) groups[m] = { city: r.city, exhs: [] };
      groups[m].exhs.push(r);
    });

    const sortedMuseums = Object.entries(groups).sort((a,b) => {
      const aOngoing = a[1].exhs.filter(e => e.status === 'Ongoing').length;
      const bOngoing = b[1].exhs.filter(e => e.status === 'Ongoing').length;
      return bOngoing - aOngoing;
    });

    el.innerHTML = sortedMuseums.map(([museum, { city, exhs }]) => {
      const ongoingCount = exhs.filter(e => e.status === 'Ongoing').length;
      const upcomingCount = exhs.filter(e => e.status === 'Upcoming').length;
      const counts = [
        ongoingCount ? `<span class="count-badge ongoing">${ongoingCount} on now</span>` : '',
        upcomingCount ? `<span class="count-badge upcoming">${upcomingCount} upcoming</span>` : '',
      ].filter(Boolean).join('');

      return `
        <div class="museum-section">
          <div class="museum-header" onclick="toggleMuseum(this)" data-museum="${escAposAttr(museum)}">
            <div>
              <div class="museum-name">${escHtml(museum)}</div>
              <div class="museum-city">${escHtml(city || '')}</div>
            </div>
            <div class="museum-counts">
              ${counts}
              <span class="museum-toggle-icon open">›</span>
            </div>
          </div>
          <div class="museum-exhs" data-museum-body>
            ${exhs.map(r => renderExhCard(r, true)).join('')}
          </div>
        </div>
      `;
    }).join('');
  }
}

function toggleMuseum(header) {
  const body = header.nextElementSibling;
  const icon = header.querySelector('.museum-toggle-icon');
  const isOpen = body.style.display !== 'none';
  body.style.display = isOpen ? 'none' : 'grid';
  icon.classList.toggle('open', !isOpen);
}

function openModal(id) {
  const r = allRecords.find(rec => rec.id === id);
  if (!r) return;

  const museum = getMuseumKey(r);
  const sc = statusClass(r.status);

  const imgWrap = document.getElementById('modalImgWrap');
  imgWrap.innerHTML = r.image
    ? `<img class="modal-img" src="${r.image}" alt="" onerror="this.style.display='none'">`
    : `<div class="modal-img-placeholder">🖼</div>`;

  const dot = document.getElementById('modalDot');
  dot.className = `modal-dot ${sc}`;

  const statusText = document.getElementById('modalStatusText');
  statusText.textContent = r.status || 'Past';
  statusText.className = `modal-status-text ${sc}`;

  document.getElementById('modalTitle').textContent = r.name || '';
  document.getElementById('modalMuseum').textContent = museum;
  document.getElementById('modalCity').textContent = r.city || '';

  const notesEl = document.getElementById('modalNotes');
  if (r.notes) {
    notesEl.textContent = r.notes;
    notesEl.style.display = 'block';
  } else {
    notesEl.style.display = 'none';
  }

  const actionsEl = document.getElementById('modalActions');
  const link = r.location || r.website || r.mapsUrl;
  actionsEl.innerHTML = link
    ? `<a class="modal-btn modal-btn-primary" href="${link}" target="_blank" rel="noopener">View Exhibition ↗</a>`
    : '';
  actionsEl.innerHTML += `<button class="modal-btn modal-btn-secondary" onclick="closeModal()">Close</button>`;

  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modalClose').addEventListener('click', closeModal);
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// View toggle
document.getElementById('btnGrid').addEventListener('click', () => {
  viewMode = 'grid';
  document.getElementById('btnGrid').classList.add('active');
  document.getElementById('btnMuseum').classList.remove('active');
  render();
});

document.getElementById('btnMuseum').addEventListener('click', () => {
  viewMode = 'museum';
  document.getElementById('btnMuseum').classList.add('active');
  document.getElementById('btnGrid').classList.remove('active');
  render();
});

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escApos(s) {
  return String(s || '').replace(/'/g, "\\'");
}

function escAposAttr(s) {
  return String(s || '').replace(/"/g,'&quot;');
}

async function init() {
  showSkeleton();
  buildStatusTabs();
  try {
    const res = await fetch(API);
    const data = await res.json();
    allRecords = data.records || [];

    const ongoing = allRecords.filter(r => r.status === 'Ongoing').length;
    const cities = new Set(allRecords.map(r => r.city).filter(Boolean));
    document.getElementById('heroMeta').textContent = `${ongoing} on now · ${allRecords.length} total · ${cities.size} cities`;

    buildCityTabs(allRecords);
    render();
  } catch(e) {
    document.getElementById('contentEl').innerHTML = `<div class="no-results">Failed to load exhibitions.<br><span style="font-size:11px;margin-top:4px;display:block">${e.message}</span></div>`;
  }
}

init();
</script>
</body>
</html>
