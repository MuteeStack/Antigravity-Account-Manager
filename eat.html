<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Y-List — Eat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --bg2: #111111;
    --bg3: #1a1a1a;
    --text: #f5f2eb;
    --text-muted: #8a8680;
    --text-dim: #555250;
    --accent: #e8d5a3;
    --accent2: #c4a882;
    --border: #222220;
    --border2: #2a2a28;
    --gold: #c9a84c;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── NAV ── */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 0;
    max-width: 720px;
    margin: 0 auto;
  }

  .nav-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 22px;
    letter-spacing: -0.3px;
    color: var(--text);
    text-decoration: none;
  }

  .nav-links {
    display: flex;
    gap: 4px;
  }

  .nav-link {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    text-decoration: none;
    color: var(--text-muted);
    transition: all 0.18s;
    letter-spacing: 0.02em;
  }

  .nav-link:hover { color: var(--text); }

  .nav-link.active {
    background: var(--bg3);
    color: var(--text);
    border: 1px solid var(--border2);
  }

  /* ── HERO ── */
  .hero {
    max-width: 720px;
    margin: 0 auto;
    padding: 28px 20px 0;
  }

  .hero h1 {
    font-family: 'DM Serif Display', serif;
    font-size: clamp(32px, 8vw, 48px);
    line-height: 1.05;
    letter-spacing: -1px;
    color: var(--text);
  }

  .hero h1 em {
    font-style: italic;
    color: var(--accent);
  }

  .hero-meta {
    margin-top: 10px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  /* ── STICKY CONTROLS ── */
  .controls {
    position: sticky;
    top: 0;
    z-index: 100;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    max-width: 720px;
    margin: 0 auto;
  }

  .search-wrap {
    position: relative;
    margin-bottom: 10px;
  }

  .search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
    font-size: 14px;
  }

  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 11px 16px 11px 40px;
    outline: none;
    transition: border-color 0.18s;
  }

  .search-input::placeholder { color: var(--text-dim); }
  .search-input:focus { border-color: var(--accent2); }

  .filter-row {
    display: flex;
    gap: 8px;
    align-items: center;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 2px;
  }

  .filter-row::-webkit-scrollbar { display: none; }

  .filter-label {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .vibe-btn {
    flex-shrink: 0;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg3);
    border: 1px solid var(--border2);
    color: var(--text);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.16s;
    position: relative;
  }

  .vibe-btn:hover { border-color: var(--accent2); transform: scale(1.08); }

  .vibe-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .sort-select {
    margin-left: auto;
    flex-shrink: 0;
    background: var(--bg3);
    border: 1px solid var(--border2);
    border-radius: 8px;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    padding: 6px 10px;
    outline: none;
    cursor: pointer;
  }

  /* ── CITY FILTER ── */
  .city-tabs {
    display: flex;
    gap: 6px;
    padding: 14px 20px 0;
    max-width: 720px;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .city-tabs::-webkit-scrollbar { display: none; }

  .city-tab {
    flex-shrink: 0;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 500;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.16s;
    white-space: nowrap;
  }

  .city-tab:hover { color: var(--text); border-color: #444; }

  .city-tab.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  /* ── LIST ── */
  .list-container {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 18px 0 8px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 0;
  }

  /* Skeleton */
  .skeleton-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
    animation: shimmer 1.4s infinite;
  }

  .skeleton-thumb {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    background: var(--bg3);
    flex-shrink: 0;
  }

  .skeleton-lines { flex: 1; display: flex; flex-direction: column; gap: 8px; }

  .skeleton-line {
    height: 10px;
    border-radius: 5px;
    background: var(--bg3);
  }

  .skeleton-line.w60 { width: 60%; }
  .skeleton-line.w40 { width: 40%; }
  .skeleton-line.w80 { width: 80%; }

  @keyframes shimmer {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  /* Restaurant row */
  .rest-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background 0.14s;
    border-radius: 4px;
    text-decoration: none;
    color: inherit;
  }

  .rest-row:hover { background: rgba(255,255,255,0.025); }

  .rest-thumb {
    width: 52px;
    height: 52px;
    border-radius: 8px;
    background: var(--bg3);
    flex-shrink: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    border: 1px solid var(--border);
  }

  .rest-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .rest-info { flex: 1; min-width: 0; }

  .rest-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .top-pick-badge {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    background: var(--gold);
    color: #000;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .rest-sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .rest-right {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    flex-shrink: 0;
  }

  .rest-price {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
  }

  .rest-vibes {
    display: flex;
    gap: 3px;
    font-size: 14px;
  }

  .rest-chevron {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: 4px;
  }

  .no-results {
    padding: 40px 0;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
  }

  .result-count {
    font-size: 12px;
    color: var(--text-dim);
    padding: 14px 0 6px;
  }

  /* notes tooltip */
  .rest-note {
    font-size: 11px;
    color: var(--accent2);
    font-style: italic;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 200px;
  }
</style>
</head>
<body>

<div style="max-width:720px;margin:0 auto">

  <nav class="nav">
    <a href="#" class="nav-logo">Y‑List</a>
    <div class="nav-links">
      <a href="eat.html" class="nav-link active">Eat</a>
      <a href="art.html" class="nav-link">Art</a>
    </div>
  </nav>

  <div class="hero">
    <h1>Where to <em>eat.</em></h1>
    <div class="hero-meta" id="heroMeta">Loading restaurants…</div>
  </div>

</div>

<div class="city-tabs" id="cityTabs"></div>

<div style="max-width:720px;margin:0 auto">
  <div class="controls">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input class="search-input" type="text" placeholder="Search restaurants, neighborhoods…" id="searchInput" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
    <div class="filter-row">
      <span class="filter-label">Vibe</span>
      <div id="vibeFilters" style="display:flex;gap:8px;align-items:center;"></div>
      <select class="sort-select" id="sortSelect">
        <option value="default">Sort: Default</option>
        <option value="name">Name A–Z</option>
        <option value="price-asc">Price ↑</option>
        <option value="price-desc">Price ↓</option>
      </select>
    </div>
  </div>
</div>

<div class="list-container">
  <div id="listEl"></div>
</div>

<script>
const API = 'https://ylist-api.ymanoukian.workers.dev/api/eat';
const PRICE_ORDER = { '$': 1, '$$': 2, '$$$': 3, '$$$$': 4 };
const EMOJI_MAP = { '🔥':'🔥','🌙':'🌙','🍸':'🍸','🥞':'🥞','🍜':'🍜','🥩':'🥩','🍣':'🍣','🌿':'🌿' };

let allRecords = [];
let activeCity = 'All';
let activeVibe = null;
let searchQuery = '';
let sortMode = 'default';

// Skeleton
function showSkeleton() {
  const el = document.getElementById('listEl');
  el.innerHTML = Array(8).fill(0).map(() => `
    <div class="skeleton-row">
      <div class="skeleton-thumb"></div>
      <div class="skeleton-lines">
        <div class="skeleton-line w80"></div>
        <div class="skeleton-line w60"></div>
      </div>
      <div style="width:30px">
        <div class="skeleton-line w40" style="height:8px"></div>
      </div>
    </div>
  `).join('');
}

// Extract all vibes from data
function extractVibes(records) {
  const set = new Set();
  records.forEach(r => {
    if (!r.vibes) return;
    r.vibes.forEach(v => {
      // each vibe string might have multiple emojis
      const matches = v.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27FF}]/gu);
      if (matches) matches.forEach(e => set.add(e));
    });
  });
  return [...set];
}

function hasVibe(record, vibe) {
  if (!record.vibes || !vibe) return true;
  return record.vibes.some(v => v.includes(vibe));
}

function buildCityTabs(records) {
  const cities = ['All', ...new Set(records.map(r => r.city).filter(Boolean))].sort((a,b) => a === 'All' ? -1 : 0);
  const el = document.getElementById('cityTabs');
  el.innerHTML = cities.map(c => `
    <button class="city-tab${c === activeCity ? ' active' : ''}" data-city="${c}">${c}</button>
  `).join('');
  el.querySelectorAll('.city-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      activeCity = btn.dataset.city;
      el.querySelectorAll('.city-tab').forEach(b => b.classList.toggle('active', b.dataset.city === activeCity));
      render();
    });
  });
}

function buildVibeFilters(records) {
  const vibes = extractVibes(records);
  const el = document.getElementById('vibeFilters');
  el.innerHTML = vibes.map(v => `
    <button class="vibe-btn${v === activeVibe ? ' active' : ''}" data-vibe="${v}" title="${v}">${v}</button>
  `).join('');
  el.querySelectorAll('.vibe-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const v = btn.dataset.vibe;
      activeVibe = activeVibe === v ? null : v;
      el.querySelectorAll('.vibe-btn').forEach(b => b.classList.toggle('active', b.dataset.vibe === activeVibe));
      render();
    });
  });
}

function getInitials(name) {
  return name.split(' ').slice(0,2).map(w => w[0]).join('').toUpperCase();
}

function priceScore(p) { return PRICE_ORDER[p] || 0; }

function render() {
  const q = searchQuery.toLowerCase().trim();
  let records = allRecords;

  // City filter
  if (activeCity !== 'All') {
    records = records.filter(r => r.city === activeCity);
  }

  // Vibe filter
  if (activeVibe) {
    records = records.filter(r => hasVibe(r, activeVibe));
  }

  // Search
  if (q) {
    records = records.filter(r =>
      (r.name || '').toLowerCase().includes(q) ||
      (r.neighborhood || '').toLowerCase().includes(q) ||
      (r.city || '').toLowerCase().includes(q) ||
      (r.notes || '').toLowerCase().includes(q)
    );
  }

  // Sort
  if (sortMode === 'name') {
    records = [...records].sort((a,b) => (a.name||'').localeCompare(b.name||''));
  } else if (sortMode === 'price-asc') {
    records = [...records].sort((a,b) => priceScore(a.price) - priceScore(b.price));
  } else if (sortMode === 'price-desc') {
    records = [...records].sort((a,b) => priceScore(b.price) - priceScore(a.price));
  } else {
    // Default: top picks first
    records = [...records].sort((a,b) => (b.topPick ? 1 : 0) - (a.topPick ? 1 : 0));
  }

  const topPicks = records.filter(r => r.topPick);
  const rest = records.filter(r => !r.topPick);

  const el = document.getElementById('listEl');

  if (records.length === 0) {
    el.innerHTML = `<div class="no-results">No restaurants found.<br><span style="font-size:11px;margin-top:4px;display:block">Try adjusting your search or filters.</span></div>`;
    return;
  }

  let html = `<div class="result-count">${records.length} restaurant${records.length !== 1 ? 's' : ''}</div>`;

  const renderRow = (r) => {
    const vibeIcons = (r.vibes || []).flatMap(v => {
      const m = v.match(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27FF}]/gu);
      return m || [];
    }).slice(0,3);

    const thumb = r.image
      ? `<img src="${r.image}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<span>${getInitials(r.name)}</span>'">`
      : `<span>${getInitials(r.name)}</span>`;

    const sub = [r.neighborhood, r.city].filter(Boolean).join(' · ');
    const mapsAttr = r.mapsUrl ? `href="${r.mapsUrl}" target="_blank" rel="noopener"` : `href="#"`;

    return `
      <a class="rest-row" ${mapsAttr}>
        <div class="rest-thumb">${thumb}</div>
        <div class="rest-info">
          <div class="rest-name">
            ${escHtml(r.name || 'Unknown')}
            ${r.topPick ? '<span class="top-pick-badge">Top Pick</span>' : ''}
          </div>
          <div class="rest-sub">${escHtml(sub)}</div>
          ${r.notes ? `<div class="rest-note">${escHtml(r.notes)}</div>` : ''}
        </div>
        <div class="rest-right">
          <span class="rest-price">${r.price || ''}</span>
          ${vibeIcons.length ? `<div class="rest-vibes">${vibeIcons.join('')}</div>` : ''}
        </div>
        <span class="rest-chevron">›</span>
      </a>
    `;
  };

  if (topPicks.length && sortMode === 'default' && !q && !activeVibe) {
    html += `<div class="section-label">⭐ Top Picks</div>`;
    html += topPicks.map(renderRow).join('');
    if (rest.length) {
      html += `<div class="section-label" style="margin-top:8px">All Restaurants</div>`;
      html += rest.map(renderRow).join('');
    }
  } else {
    html += records.map(renderRow).join('');
  }

  el.innerHTML = html;
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function init() {
  showSkeleton();
  try {
    const res = await fetch(API);
    const data = await res.json();
    allRecords = data.records || [];

    document.getElementById('heroMeta').textContent = `${allRecords.length} restaurants across ${new Set(allRecords.map(r=>r.city).filter(Boolean)).size} cities`;

    buildCityTabs(allRecords);
    buildVibeFilters(allRecords);
    render();
  } catch(e) {
    document.getElementById('listEl').innerHTML = `<div class="no-results">Failed to load restaurants.<br><span style="font-size:11px;margin-top:4px;display:block">${e.message}</span></div>`;
  }
}

document.getElementById('searchInput').addEventListener('input', e => {
  searchQuery = e.target.value;
  render();
});

document.getElementById('sortSelect').addEventListener('change', e => {
  sortMode = e.target.value;
  render();
});

init();
</script>
</body>
</html>
